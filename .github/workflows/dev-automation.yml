name: Dev Automation

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      DEV_SMOKE_EMAIL: ${{ secrets.DEV_SMOKE_EMAIL }}
      DEV_SMOKE_PASSWORD: ${{ secrets.DEV_SMOKE_PASSWORD }}
      DEV_SMOKE_BASE_URL: ${{ secrets.DEV_SMOKE_BASE_URL }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Smoke (dev)
        run: npm run smoke:dev
      - name: Smoke (playwright)
        run: npm run smoke:pw
